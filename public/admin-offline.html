<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#102a50" />
    <title>Offline | Admin SS Infra</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #102a50; color: #fff;
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px; box-sizing: border-box; }
      main { max-width: 26rem; }
      h1 { font-size: 1.75rem; margin: 0 0 .5rem; }
      p { color: rgba(255,255,255,.8); margin: 0 0 1.5rem; }
      button { min-height: 48px; padding: 0 20px; border: 0; border-radius: 3px; background: #fff; color: #102a50;
        font: inherit; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Admin SS Infra needs a connection to show leads and pricing. Lead details are never stored on this device.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
